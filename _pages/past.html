---
layout: default
title: Past Conferences
---
<div class="container">
    <div class="row">
        <div class="col text-center">
            <h1>Past Conferences</h1>
        </div>
    </div>
    <div class="row">
        <div class="col">
            {% for conference in site.data.past_conferences %}
            <p><a href="{{ conference.url | relative_url }}">{{ conference.name }}</a></p>
            {% endfor %}
        </div>
    </div>
</div>
