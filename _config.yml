# Site settings. Conference dates, committee, schedule, and posters live in _data/.
# This file is not reloaded by `jekyll serve`; restart the server after editing it.

title: "Air Quality: Science for Solutions"
email: lundrigan@byu.edu
description: >-
  An annual conference on air quality in Utah and the Intermountain West.
baseurl: ""
url: "https://aq.byu.edu"
permalink: pretty

plugins:
  - jekyll-sitemap

collections:
  pages:
    output: true
    permalink: /:name/

# Keep build and helper files out of the deployed site.
exclude:
  - Makefile
  - schedule_to_csv.py
  - README.md
