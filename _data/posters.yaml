# Posters by category, shown on the Program page. Posters are numbered in
# order down the list. Mark a poster `dropped: true` to hide it while keeping
# the numbers after it the same. The 2026 posters are archived at /past/2026/.
#
# Example:
#
# - category: Atmospheric Chemistry/Physics
#   posters:
#     - author: Jane Smith
#       title: "Title of the poster"
#       link: https://byu.app.box.com/...   # the PDF, once it's uploaded
#
#     - author: John Doe
#       title: "Another poster"
#       dropped: true

