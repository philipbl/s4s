# The day's schedule, shown on the Program page and the printable schedule
# (/print_schedule/). `make schedule_csv` turns it into a CSV.
#
# Items with talks are sessions; anything else (welcome, breaks, lunch) is a
# short row. A name like "Session 1: Exposure Assessment" shows "Session 1"
# as a label above the title. The 2026 schedule is archived at /past/2026/.
#
# Example:
#
# schedule:
#   - name: Welcome
#     start_time: 9:00 AM
#     chair: Darrell
#
#   - name: "Session 1: Exposure Assessment"
#     start_time: 9:30 AM
#     chair: Nancy
#     talks:
#       - author: Jane Smith
#         title: "Title of the talk"
#         link: https://byu.app.box.com/...   # slides, once they're uploaded

# Shows a "draft schedule" notice on the Program page while true.
draft: true

schedule: []
