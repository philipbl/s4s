<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ site.description }}">
<meta name="theme-color" content="#00406e">

{% comment %} A page can pass a full title as `title` when it includes this file. {% endcomment %}
<title>{% if include.title %}{{ include.title }}{% else %}{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}{% endif %}</title>

<link rel="preload" href="{{ '/fonts/outfit-latin-wght.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/fonts/inter-latin-wght.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% link styles/main.css %}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
